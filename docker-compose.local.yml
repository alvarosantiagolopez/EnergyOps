services:
  postgres:
    image: postgres:16-alpine
    container_name: energyops-postgres
    environment:
      POSTGRES_DB: energyops
      POSTGRES_USER: energyops
      POSTGRES_PASSWORD: energyops_dev
    ports:
      - "5432:5432"
    volumes:
      - energyops-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energyops -d energyops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  energyops-postgres-data:
